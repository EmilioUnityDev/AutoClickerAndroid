name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Clave de firma de desarrollo
        env:
          DEV_KEYSTORE_B64: ${{ secrets.DEV_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEV_KEYSTORE_B64" ]; then
            echo "$DEV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dev.jks"
            echo "DEV_KEYSTORE_PATH=$RUNNER_TEMP/dev.jks" >> "$GITHUB_ENV"
          fi

      - name: Tests unitarios
        run: gradle --no-daemon testDebugUnitTest

      - name: Compilar APK de desarrollo
        env:
          DEV_KEYSTORE_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          DEV_KEY_ALIAS: dev
          DEV_KEY_PASSWORD: ${{ secrets.DEV_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.1.${{ github.run_number }}
        run: gradle --no-daemon assembleDebug

      - name: Renombrar APK
        run: mv app/build/outputs/apk/debug/app-debug.apk "AutoClicker-dev-0.1.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AutoClicker-dev-0.1.${{ github.run_number }}
          path: AutoClicker-dev-*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
